<style>

</style></head><body><div class="w">
<div id="s0"><div class="card">
<div class="sub">心理小测 · 仅供娱乐</div>
<h1>十种自动反应测试<br><em>看看你一慌就会怎么做</em></h1>
<p class="sub">不是评判你好不好，只是看看压力来了，你的身体和脑子习惯先往哪边跑。凭第一反应选就行，别想太久。</p>
<div class="stats"><div><b>40</b><span>生活场景</span></div><div><b>10</b><span>种反应</span></div><div><b>4-5</b><span>分钟完成</span></div></div>
<button class="btn" onclick="start()">开始测试</button><p class="sub" style="text-align:center;margin:14px 0 0"><a href="#" onclick="demo(0);return false" style="color:var(--sub)">先看看结果示例</a></p></div></div>
<div id="s1" class="hide"><div class="bar"><i id="pg"></i></div><div class="card"><div class="sub" id="no"></div><div class="q" id="q"></div><div id="os"></div></div><button id="bk" onclick="back()" style="background:none;border:0;color:var(--sub);font-size:15px;padding:8px 4px">← 上一题</button></div>
<div id="s2" class="hide"><div id="dm"></div>
<div class="card"><div class="sub">你的主导反应是</div><div class="big" id="rn"></div><div id="rd"></div><div class="sub" style="margin-top:10px">匹配度 <b id="rs"></b> / 100</div></div>
<div class="card"><div style="font-weight:600;text-align:center;margin-bottom:6px">十维雷达图</div><div id="rad"></div></div>
<div class="card"><div style="font-weight:600;margin-bottom:6px">十种反应得分</div><div id="bars"></div></div>
<div class="card" id="an"></div><button class="btn" onclick="location.reload()">再测一次</button>
<p class="sub" style="text-align:center">本测试为娱乐性质，不构成任何心理诊断。</p></div>
</div>
<script>

["逃避","事情一压下来，先躲一躲。你不是懒，是太想先安全。但没回的消息和没做的事，都会在角落里等你。"],

var Q=[[0,"计划被别人突然打乱时，我会忍不住想接手重新安排。"],[0,"小组做事，我宁愿自己多干也不想让别人搞砸。"],
[1,"明明不想去，别人一邀请我还是会说“好啊”。"],[1,"别人脸色一变，我就开始想是不是我做错了什么。"],

[0,"别人做事的方式跟我不一样，我会很想开口纠正。"],[0,"事情不在我掌握中的时候，我会特别焦躁。"],
[1,"我很难当面拒绝别人的请求。"],[1,"吵架后总是我先低头，哪怕我觉得自己没错。"],

[8,"周围人都很激动的时候，我常常觉得跟我没关系。"],[8,"最近很少有什么事能让我特别兴奋或特别难过。"],
[9,"说好要忍住的事，我常常忍不过三天。"],[9,"做决定的时候，我多半凭一时的感觉。"]];
var O=["完全不像我","有一点","比较像","太像我了"];
var order=[],i=0,ans=[];
function $(x){return document.getElementById(x)}
function start(){order=Q.map(function(_,k){return k}).sort(function(){return Math.random()-.5});$("s0").className="hide";$("s1").className="";show()}

$("os").innerHTML=O.map(function(t,k){return '<button class="opt'+(ans[i]===k?' on':'')+'" onclick="pick('+k+')">'+t+'</button>'}).join("")}
function pick(v){ans[i]=v;i++;if(i<Q.length)show();else done()}
function back(){if(i>0){i--;show()}}
var A=[
[['群里约饭，你已经把时间地点订好了','同事交上来的东西，你忍不住自己再改一遍','临时被打乱安排，整个人开始烦躁'],'控制感是你对付不确定的办法：事情在手里，心才稳，一失控，焦虑就冒出来。如果从小经常得自己扛事，这个习惯会更重。',['先分清「我能管的」和「管不了的」，写成两列','每天故意放手一件小事，看看天会不会塌','别人没按你的方式做，先问结果对不对，再问方式对不对']],
[['明明累了，朋友一约还是说「好啊」','别人脸色一沉，你先想是不是自己说错了','吵完架，总是你先发消息'],'你很早就学会了：照顾好别人的情绪，自己才安全。这让你人缘好，但「我想要什么」也越来越难说出口。',['拒绝前先给自己十分钟，不当场回答','每周挑一件事，只按自己想的选','试着说「我可以，但是……」，而不是直接答应']],
[['越重要的事，越想先刷会儿手机','消息放着不点开，一放就是好几天','被问到难受的话题，马上岔开'],'逃避不是懒，是大脑想先把你从不舒服里拉出来。可事情不会消失，拖得越久越吓人，你就越想躲。',['把事拆成「只做五分钟」的小块','先回最短的一句：「我看到了，晚点细说」','拖了很久的那件事，今天只做第一步']],
[['睡前把白天的一句话反复回放','消息发出去后，一直想对方会怎么理解','还没发生的事，已经演了三种结局'],'你的脑子总想提前备好所有可能，好让自己不被打个措手不及。可想得越多越停不下来，人也越累。',['脑子转圈时，把担心写下来，约好「明天再想」','问自己：这件事今天我能做什么？没有，就先放','睡前十分钟不看手机，让脑子降降速']],
[['作品差一点，就不想拿给别人看','做到九十分，眼睛还盯着缺的十分','没准备到最好，就觉得自己还不配开始'],'你标准高，所以做出来的东西确实不错。可「不够好」的声音一直在，让你很难真的满意，也容易迟迟不开始。',['先做出「能用的版本」，再慢慢改','给每件事设一条「够好线」，到了就停','别人夸你的时候，先说谢谢，别马上反驳']],
[['发了动态，会反复点开看有没有人点赞','被别人比下去，心里闷好几天','被夸一句，能开心很久'],'你对「被看见」很敏感，这也是你的动力：想变好，想被认可。只是太依赖别人的反馈，心情就容易被牵着走。',['发之前问自己：我是想分享，还是想要反馈','把除了被夸之外的开心事写下来，比如自己做成的小事','少看别人的榜单，多看自己比上个月多了什么']],
[['做决定前，先问问朋友怎么想','一个人待久了，会莫名发慌','遇到难题，第一反应是找人帮忙'],'你重感情，也需要身边有人的踏实感。问题是时间久了，容易觉得「我自己不行」，其实你比自己以为的更扛得住。',['做小决定时，先自己想出答案，再去问别人','每周安排一次一个人的事，比如散步、看电影','把「我自己扛过来的事」列出来，提醒自己']],
[['对方回得很短，你就开始猜是不是生气了','别人突然对你很好，你第一反应是他想要什么','别人在笑，你会想是不是在笑我'],'你的感知很灵敏，是因为怕被伤到，所以想先发现风险。可脑补多了，就容易把别人的「忙」读成「不在乎」。',['先问自己：我有证据，还是只是感觉','想不通的事，直接问一句「你刚才是什么意思？」','给对方留一个「他只是在忙」的可能']],
[['很多事你都觉得「无所谓，算了」','周围人很激动时，你却没什么感觉','该难过的时候，反而什么都感觉不到'],'麻木常常是一种保护：压力太大，心就先关机，省得疼。可关太久，开心也会跟着变淡。',['每天花一分钟问自己：此刻身体哪里有感觉','做一件小时候会开心的事，不用有意义','如果长期提不起劲，找信任的人聊聊，或者找专业的人']],
[['看到喜欢的东西，下单比思考快','情绪上来，话说出口才后悔','说好要忍的事，常常忍不过三天'],'你的情绪和行动之间几乎没有缓冲，所以你很真实、有行动力。代价是事后常想：当时要是等一下就好了。',['大额下单先放进购物车，隔夜再决定','要发火时先喝口水，数到十','重要的话先打在备忘录里，别马上发']]];
function li(a){return a.map(function(t){return '<li>'+t+'</li>'}).join('')}
function ana(p,m){var a=A[m],o=p.map(function(v,k){return [v,k]}).sort(function(x,y){return y[0]-x[0]}),s=o[1][1],l=o[9][1];
return '<div style="font-weight:600">具体分析</div><div class="h">你可能经常这样</div><ul>'+li(a[0])+'</ul><div class="h">为什么会这样</div><div style="font-size:14px">'+a[1]+'</div><div class="h">可以试试</div><ul>'+li(a[2])+'</ul><div class="h">你的第二反应：'+D[s][0]+'（'+p[s]+'）</div><div style="font-size:14px">'+D[s][1]+'</div><div class="h">最不明显的一项：'+D[l][0]+'（'+p[l]+'）</div><div style="font-size:14px">这一块你相对松弛，压力大的时候，可以先靠它稳住自己。</div>'}

function done(pp){$("s1").className="hide";$("s2").className="";

ax+='<line x1="'+c+'" y1="'+c+'" x2="'+x+'" y2="'+y+'" stroke="var(--line)"/>';
pts.push((c+r*p[k]/100*Math.cos(a)).toFixed(1)+","+(c+r*p[k]/100*Math.sin(a)).toFixed(1));
lb+='<text x="'+(c+(r+24)*Math.cos(a))+'" y="'+(c+(r+24)*Math.sin(a)+4)+'" text-anchor="middle" font-size="12" fill="var(--sub)">'+D[k][0]+'</text>'}
var g="";[.33,.66,1].forEach(function(f){var q=[];for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5;q.push((c+r*f*Math.cos(a))+","+(c+r*f*Math.sin(a)))}g+='<polygon points="'+q.join(" ")+'" fill="none" stroke="var(--line)"/>'});
